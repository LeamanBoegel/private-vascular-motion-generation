[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "private-vascular-motion-generation"
version = "0.4.0"
description = "Coupling-anisotropic differentially private synthesis of angiographic frames and catheter motion"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "The Multi-Centre Endovascular Robot Learning Consortium" }]
keywords = ["differential privacy", "privacy-preserving generative model", "endovascular navigation", "angiography"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "black>=24.3",
  "isort>=5.13",
  "mypy>=1.9",
  "pre-commit>=3.7",
]

[project.scripts]
caps-run-study = "private_vascular_motion_generation.cli.run_study:main"
caps-verify = "private_vascular_motion_generation.cli.verify:main"
caps-summarise = "private_vascular_motion_generation.cli.summarise:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
private_vascular_motion_generation = ["py.typed"]

[tool.black]
line-length = 120
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["private_vascular_motion_generation"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Import order is owned by isort alone; ruff keeps the remaining lint families so the two
# tools never disagree about the same fix. PLC0415: the verification driver imports the claim
# map inside one check to keep the reporting module out of the execution import path.
# RUF002/RUF046: Greek privacy symbols are deliberate. PLR0913: configuration constructors
# carry the declared protocol fields.
select = ["E", "F", "W", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "ARG", "PL", "RUF"]
ignore = [
  "PLR0913", "PLR0912", "PLR0915", "PLR2004", "N806",
  "PLC0415", "RUF002", "RUF046", "B905", "RUF007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src/private_vascular_motion_generation"]

[[tool.mypy.overrides]]
# torch ships Tensor.backward without annotations, so the three modules that call it in a typed
# loop relax that single error code rather than silencing the call sites.
module = [
  "private_vascular_motion_generation.policy.sac",
  "private_vascular_motion_generation.policy.world_model",
  "private_vascular_motion_generation.runner.overfit",
]
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
